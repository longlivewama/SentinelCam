name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Cheap guards that fail a PR before anything expensive runs.
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No real .env files committed
        run: |
          # .env.example templates are fine; an actual .env is not.
          found=$(git ls-files | grep -E '(^|/)\.env$' || true)
          if [ -n "$found" ]; then
            echo "::error::committed environment file(s): $found"
            exit 1
          fi

      - name: No unexpectedly large files
        run: |
          # The trained detector (~5.4MB) is the largest thing we intend to
          # ship. Anything past 10MB is almost certainly a checkpoint or a
          # dataset that belongs behind .gitignore.
          oversized=$(git ls-files | while read -r f; do
            [ -f "$f" ] && [ "$(wc -c < "$f")" -gt 10485760 ] && echo "$f"
          done)
          if [ -n "$oversized" ]; then
            echo "::error::file(s) over 10MB committed: $oversized"
            exit 1
          fi

      - name: Trained model artifact is present and intact
        # A truncated checkout or an LFS pointer would leave the app
        # silently falling back to the weaker pose heuristic.
        run: |
          python3 - <<'CHECK'
          import hashlib, json, sys
          from pathlib import Path
          meta = json.loads(Path("ml/exported/fall_detector_v1.metadata.json").read_text())
          artifact = Path(meta["file"]["path"])
          if not artifact.exists():
              sys.exit(f"::error::missing model artifact {artifact}")
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          if digest != meta["file"]["sha256"]:
              sys.exit(f"::error::{artifact} sha256 {digest} != metadata {meta['file']['sha256']}")
          print(f"{artifact}: {artifact.stat().st_size} bytes, sha256 OK")
          CHECK

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinelcam
          POSTGRES_PASSWORD: sentinelcam
          POSTGRES_DB: sentinelcam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # opencv-python (headless import) needs these shared libs on a bare
      # Ubuntu runner, and ultralytics will auto-download YOLO weights on
      # first use (gitignored, not committed) - both need network/apt.
      - name: Install system dependencies for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://sentinelcam:sentinelcam@localhost:5432/sentinelcam_test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Node 22: jsdom 30 (via vitest's jsdom environment) pulls in an undici
      # that needs a newer Node than the 20.x the runner resolves - on Node 20
      # every test file dies at import with
      # "webidl.util.markAsUncloneable is not a function".
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the frontend job. Keeping one Node version across jobs
          # removes a class of "passes in one job, fails in the other".
          node-version: "22"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      # Brings up postgres+mailpit+backend+frontend via docker compose,
      # seeds fixture data, runs the suite, and tears the stack down again
      # - see e2e/README.md. Same commands a developer runs locally.
      # E2E_KEEP_STACK: this is an ephemeral CI runner either way, so skip
      # the teardown and leave containers up for the log-dump step below.
      - name: Run e2e suite
        working-directory: e2e
        env:
          E2E_KEEP_STACK: "1"
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Informational, not blocking: the two residual findings here
      # (ecdsa - unreachable code path, we only use HS256; pyasn1 - pinned
      # transitively by python-jose<0.5.0, upgrading it breaks python-jose)
      # are documented as accepted risks in README.md's Security section.
      # This step still runs on every build so a genuinely NEW
      # vulnerability shows up in CI output for review.
      - name: pip-audit (backend dependencies)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (frontend dependencies, informational)
        working-directory: frontend
        run: npm audit --audit-level=critical
        continue-on-error: true

      # Blocking, unlike the two informational audits above: a credential
      # in the diff is never an accepted risk.
      - name: Scan the diff for credential-shaped strings
        run: |
          git fetch --no-tags --depth=100 origin "${{ github.base_ref || github.ref_name }}" || true
          base=$(git merge-base HEAD FETCH_HEAD 2>/dev/null || git rev-parse HEAD~1)
          # Deliberately narrow - real provider key formats and private
          # keys. Placeholders like "change-me-in-production" and the empty
          # values in .env.example templates do not match.
          added=$(git diff "$base"..HEAD -U0 -- . ':(exclude)*.lock' ':(exclude)**/package-lock.json' | grep -E '^\+' || true)
          if printf '%s' "$added" | grep -E 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{32}|BEGIN [A-Z ]*PRIVATE KEY'; then
            echo "::error::the diff contains something that looks like a credential"
            exit 1
          fi
          echo "no credential-shaped strings in the diff"
