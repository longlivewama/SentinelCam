<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">SentinelCam system architecture</title>
  <desc id="desc">The browser talks to the FastAPI backend over REST and a WebSocket. Camera frames and uploaded videos flow through background threads into a shared YOLO fall pipeline; fall events become clips, snapshots, database rows, realtime events and emails.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <style>
      .card { fill: #111a2e; stroke: #2a3a5c; stroke-width: 1.5; }
      .accent { fill: #0f2a33; stroke: #22d3ee; stroke-width: 1.5; }
      .h { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .t { fill: #94a3b8; font-size: 12.5px; }
      .lbl { fill: #7dd3fc; font-size: 12px; }
      .sec { fill: #64748b; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; }
      .flow { stroke: #38bdf8; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="740" rx="14" fill="#0b1220"/>
  <text x="30" y="42" fill="#f1f5f9" font-size="22" font-weight="700">SentinelCam</text>
  <text x="30" y="64" class="t">System architecture</text>

  <!-- Browser -->
  <rect x="300" y="72" width="460" height="78" rx="10" class="card"/>
  <text x="320" y="98" class="h">Browser — React 18 + Vite SPA</text>
  <text x="320" y="119" class="t">Dashboard · Cameras · Upload · Recordings · Alerts · Analytics</text>
  <text x="320" y="137" class="t">Zustand stores · route guards · media players with per-clip tokens</text>

  <!-- Backend container -->
  <rect x="300" y="190" width="460" height="525" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="316" y="212" class="sec">FASTAPI BACKEND · PYTHON 3.11 · UVICORN</text>

  <rect x="320" y="226" width="220" height="80" rx="10" class="card"/>
  <text x="336" y="250" class="h">REST API</text>
  <text x="336" y="270" class="t">auth · cameras · alerts</text>
  <text x="336" y="287" class="t">recordings · uploads · admin</text>
  <text x="336" y="302" class="t">MJPEG stream · ranged video</text>

  <rect x="560" y="226" width="180" height="80" rx="10" class="card"/>
  <text x="576" y="250" class="h">Realtime</text>
  <text x="576" y="270" class="t">WebSocket /api/ws/events</text>
  <text x="576" y="287" class="t">per-user delivery scoping</text>

  <rect x="320" y="320" width="420" height="58" rx="10" class="card"/>
  <text x="336" y="343" class="h">Applied to every request</text>
  <text x="336" y="363" class="t">CORS · security headers · body-size limit · JWT + RBAC · rate limits</text>

  <text x="320" y="404" class="sec">BACKGROUND THREADS</text>

  <rect x="320" y="414" width="200" height="104" rx="10" class="card"/>
  <text x="336" y="438" class="h">Camera pipeline</text>
  <text x="336" y="458" class="t">1 capture thread / camera</text>
  <text x="336" y="475" class="t">5 s rolling frame buffer</text>
  <text x="336" y="492" class="t">detection loop on every</text>
  <text x="336" y="508" class="t">3rd frame</text>

  <rect x="540" y="414" width="200" height="104" rx="10" class="card"/>
  <text x="556" y="438" class="h">Upload analysis</text>
  <text x="556" y="458" class="t">decodes the uploaded file</text>
  <text x="556" y="475" class="t">every 5th frame inferred</text>
  <text x="556" y="492" class="t">≤ 2 analyses at once</text>
  <text x="556" y="508" class="t">progress over WebSocket</text>

  <rect x="320" y="548" width="420" height="72" rx="10" class="accent"/>
  <text x="336" y="572" class="h">Fall pipeline (shared)</text>
  <text x="336" y="592" class="t">YOLOv8n fall detector (conf ≥ 0.4) · pose-heuristic fallback</text>
  <text x="336" y="609" class="t">per-subject sustain gate (≥ 0.6 s, ≥ 3 frames) → fall event</text>

  <rect x="320" y="638" width="420" height="64" rx="10" class="card"/>
  <text x="336" y="662" class="h">Event recording</text>
  <text x="336" y="682" class="t">event clip (H.264, else VP8) + snapshot JPEG</text>
  <text x="336" y="697" class="t">Event + Recording rows → realtime alert · email</text>

  <!-- Left column -->
  <rect x="30" y="414" width="220" height="104" rx="10" class="card"/>
  <text x="46" y="438" class="h">Cameras</text>
  <text x="46" y="458" class="t">RTSP / HTTP stream URL</text>
  <text x="46" y="475" class="t">or USB device index</text>

  <rect x="30" y="548" width="220" height="72" rx="10" class="card"/>
  <text x="46" y="572" class="h">Model artifacts</text>
  <text x="46" y="592" class="t">ml/exported/fall_detector_v1.pt</text>
  <text x="46" y="609" class="t">yolov8n-pose.pt · yolov8n.pt</text>

  <!-- Right column -->
  <rect x="810" y="226" width="360" height="104" rx="10" class="card"/>
  <text x="826" y="250" class="h">PostgreSQL 16</text>
  <text x="826" y="270" class="t">SQLAlchemy 2 · Alembic migrations</text>
  <text x="826" y="290" class="t">users · cameras · events · recordings</text>
  <text x="826" y="307" class="t">video_uploads · password_reset_tokens</text>

  <rect x="810" y="414" width="360" height="104" rx="10" class="card"/>
  <text x="826" y="438" class="h">File storage</text>
  <text x="826" y="458" class="t">uploads/ — source videos (per-user quota)</text>
  <text x="826" y="475" class="t">recordings/ — event clips</text>
  <text x="826" y="492" class="t">snapshots/ — alert stills</text>
  <text x="826" y="508" class="t">removed with their upload, clip or user</text>

  <rect x="810" y="638" width="360" height="64" rx="10" class="card"/>
  <text x="826" y="662" class="h">Notifications</text>
  <text x="826" y="682" class="t">Email over SMTP (Mailpit in development)</text>
  <text x="826" y="697" class="t">SMS / WhatsApp: interface stubs only</text>

  <!-- Flows -->
  <path class="flow" d="M430,150 V224"/>
  <text x="438" y="174" class="lbl">REST · Bearer JWT</text>
  <path class="flow" d="M650,226 V152"/>
  <text x="658" y="174" class="lbl">live events</text>

  <path class="flow" d="M250,466 H318"/>
  <text x="258" y="456" class="lbl">frames</text>

  <path class="flow" d="M420,518 V546"/>
  <path class="flow" d="M640,518 V546"/>
  <path class="flow" d="M250,584 H318"/>
  <text x="262" y="575" class="lbl">loads</text>

  <path class="flow" d="M530,620 V636"/>

  <path class="flow" d="M760,278 H808"/>
  <text x="764" y="270" class="lbl">SQL</text>
  <path class="flow" d="M740,652 H786 V466 H808"/>
  <path class="flow" d="M740,684 H808"/>
</svg>
