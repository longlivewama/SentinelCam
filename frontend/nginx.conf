server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The backend sets these on its own responses (see
    # backend/app/core/http_hardening.py); this origin sets none of them,
    # and this is the origin that matters most for them. It holds the SPA,
    # and the SPA holds the session token in localStorage - so an injected
    # script here is an account takeover, while an injected script on the
    # API origin has nothing to steal.
    #
    # `always` so they are present on error responses too, not just 200s.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content-Security-Policy. The part doing the work is
    # `script-src 'self'`: the built bundle is a single external module
    # script with no inline <script> anywhere (see frontend/index.html), so
    # this costs nothing and turns the whole inline/remote-script class of
    # XSS into a blocked load.
    #
    # Why the media/connect/img directives are as wide as they are: the API
    # origin is chosen at BUILD time via VITE_API_URL, so this file cannot
    # name it. `<video src>`, the MJPEG `<img src>` and every fetch point at
    # that unknown origin, and a CSP that guessed wrong would break
    # playback rather than secure it. Narrow these to your actual API
    # origin if you template this file per deployment.
    #
    #   'unsafe-inline' in style-src - React writes inline style
    #                    attributes; no equivalent hole is opened for script.
    #   data: in img-src   - the favicon is an inline SVG data URI.
    #   object-src 'none', base-uri 'self', frame-ancestors 'none' -
    #                    plugin embedding, <base> hijacking and framing all
    #                    have no legitimate use here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; connect-src 'self' http: https: ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Client-side routed SPA: any path that isn't a real static file falls
    # back to index.html so React Router handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
